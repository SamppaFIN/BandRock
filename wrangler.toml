# BandRockin Worker. Aja komennot projektin juuresta: `npm run deploy:worker`
# (kirjautuminen kerran: `npx wrangler login`).
# R2-ämpäri luodaan komennolla `npx wrangler r2 bucket create bandrock-posters` (README).
# Salaisuudet (CODE_SECRET, TURNSTILE_SECRET) asetetaan `wrangler secret put`illa, ei tähän.
name = "bandrock"
main = "worker/src/index.js"
compatibility_date = "2026-09-08"

[vars]
# Sivut, joilta selain saa kutsua Workeria (pilkulla erotettuna).
ALLOWED_ORIGINS = "https://samppafin.github.io"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bandrock-posters"

# Yksinkertainen, sijaintikohtainen nopeusrajoitin luonnille ja muokkaukselle.
# Hidastaa koodin arvaamista ja roskapostia, ei täydellinen suoja (Cloudflaren oma dokumentaatio:
# "permissive, eventually consistent" — riittää tälle, ei rahaliikenteelle).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
