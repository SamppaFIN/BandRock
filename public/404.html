<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BandRock</title>
<meta name="robots" content="noindex">
<script>
  // GitHub Pages tarjoaa tämän tiedoston, kun polkua ei löydy tiedostona
  // (esim. .../ray-jone). "index.html" on suhteellinen polku samasta kansiosta,
  // joten tämä toimii riippumatta repon nimestä. Alkuperäinen polku, mahdollinen
  // kysely ja ankkuri tallennetaan mukaan, ja router.js palauttaa siistin osoitteen.
  location.replace('index.html?p=' + encodeURIComponent(location.pathname + location.search + location.hash));
</script>
</head>
<body></body>
</html>
